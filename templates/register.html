{% extends "index.html" %}
{% block title %}상품 등록 | 깃든 마켓{% endblock %}
{% block content %}
<p class="eyebrow">PRODUCT</p>
<h1>상품 등록</h1>
<p class="intro">판매할 상품의 정보와 사진을 입력해 주세요.</p>
<form action="{{ url_for('result') }}" method="post" enctype="multipart/form-data">
    <div class="form-grid">
        <label>상품명<input name="product_name" required placeholder="상품 이름을 입력하세요"></label>
        <label>판매자 ID<input name="seller_id" required placeholder="판매자 ID"></label>
        <label>가격 (원)<input name="price" type="number" min="0" step="1" required placeholder="0"></label>
        <label>상품 상태<select name="status" required><option value="">상태 선택</option><option>새 상품</option><option>거의 새 상품</option><option>사용감 있음</option></select></label>
        <label class="wide">주소 / 거래 장소<input name="address" required placeholder="거래할 주소나 장소"></label>
        <label class="wide">이메일<input name="email" type="email" required placeholder="example@email.com"></label>
        <label class="wide">상품 사진<input name="picture" type="file" accept="image/png,image/jpeg,image/webp" required><span class="hint">PNG, JPG, WEBP · 최대 5MB</span></label>
    </div>
    <button type="submit">등록하기 (Submit)</button>
</form>
{% endblock %}
